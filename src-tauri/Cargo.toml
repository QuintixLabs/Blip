[package]
name = "blip"
version = "2.2.0"
description = "Lightweight tool that adds smooth blip effects to your clicks"
authors = ["Quintix"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
# Draws the blip shapes (smooth edges), the same on every system.
tiny-skia = "0.11.4"
tauri-plugin-dialog = "2"

# Small, fast release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(not(windows))".dependencies]
dark-light = "3.0.0"
notify-rust = "4.18.2"

# Blips on Linux: X11, and Wayland (reading the mice, asking the desktop
# where the cursor is, drawing through the layer shell).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
x11rb = { version = "0.13", features = ["xinput", "xfixes", "shape"] }
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
zbus = "5"
libc = "0.2"

# Blips on macOS: the click watcher and the see-through windows.
# The same versions Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
dispatch2 = "0.3"
libc = "0.2"
plist = "1"
