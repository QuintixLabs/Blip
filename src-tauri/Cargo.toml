[package]
name = "blip"
version = "2.0.0"
description = "Lightweight tool that adds smooth blip effects to your clicks"
authors = ["Quintix"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
# Draws the blip shapes (smooth edges), the same on every system.
tiny-skia = "0.11.4"

# Small, fast release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(not(windows))".dependencies]
dark-light = "3.0.0"
notify-rust = "4.18.2"
